name: Validate canonical rules
on:
  pull_request:
  push:
    branches: [v4]
    paths: ['libraries/**', 'icons/**', 'tools/**', 'tests/**', 'schemas/**', 'docs/**', '.github/workflows/rules-v5.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python tools/rules.py check
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s chart/tools -p 'test_*.py'
      - run: python sdk-details/tools/test.py
      - run: python sdk-details/tools/update.py --check
      - run: git diff --check
