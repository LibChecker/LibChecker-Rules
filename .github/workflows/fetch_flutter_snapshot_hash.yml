name: Generate Files from Flutter JSON

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-engine-mappings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate_files:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test generator
        run: |
          python -m unittest discover -s flutter_hash/tools -p 'test_*.py'

      - name: Generate Files
        run: |
          python flutter_hash/tools/fetcher.py

      - name: Validate generated mappings
        run: |
          python flutter_hash/tools/fetcher.py --check

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- flutter_hash)" ]]; then
            echo "No Flutter mapping changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- flutter_hash
          git commit -m "Update Flutter engine mappings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
